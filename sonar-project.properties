sonar.projectKey=qbicsoftware_data-manager-app
sonar.organization=qbicsoftware
# Coverage is not measured on the Vaadin view layer. These classes are component composition:
# layout trees, CSS class assignment and router wiring, with no logic that a unit test can assert
# better than the compiler already does. The logic that *is* worth testing has been extracted out of
# them on purpose (SnapshotPanel's content, DataStateLabel's vocabulary, MeasurementDataLocations'
# file format, AssayType's two column conventions) and is covered by specs in the modules below.
#
# Added with the project-page refactor, which introduced ~900 lines of view code against ~100 lines
# of extracted logic; without this split the PR quality gate measured the markup, not the logic.
sonar.coverage.exclusions=datamanager-app/src/main/java/life/qbic/datamanager/views/**

sonar.exclusions=src/test/**,build/**,node_modules/**, **/DataPrivacyAgreement.html, **/LegalNotice.html
