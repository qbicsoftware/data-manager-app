# See https://docs.spring.io/spring-boot/docs/current/reference/html/application-properties.html for reference
################### Logging ###################################################
logging.level.root=info
logging.level.org.springframework.security=info
logging.level.life.qbic=${DM_LOG_LEVEL:info}
logging.level.life.qbic.datamanager=${DM_LOG_LEVEL:info}
logging.level.life.qbic.projectmanagement.application.authorization.acl=debug
logging.file.path=${DM_LOG_PATH:./logs}
logging.file.max-history=60

###############################################################################
################### Security ##################################################
qbic.security.vault.key.env=DATAMANAGER_VAULT_KEY
qbic.security.vault.path=${DATAMANAGER_VAULT_PATH:keystore.p12}
qbic.security.vault.entry.password.env=DATAMANAGER_VAULT_ENTRY_PASSWORD
# Dedicated master AES-256 key alias for encrypting user external-provider
# credentials (FEAT-DATSET-14, ADR-0002 S2). The key material itself lives in
# the PKCS12 keystore (deployed at startup); this property names the alias.
# Distinct from the OpenBIS vault entries.
qbic.security.vault.external-credential.key-alias=external-credential-master-key
# Dedicated master AES-256 key alias for second-factor secrets (TOTP seeds),
# MILESTONE-MFA / ADR 0011 F1. Deliberately NOT the external-credential key: a
# lost or rotated factor key must not take stored provider credentials with it,
# and vice versa. Provision `second-factor-master-key` in the PKCS12 keystore
# before enrolment is used; until then, factor operations fail closed with
# "second factor unavailable" (the application still starts).
qbic.security.vault.second-factor.key-alias=second-factor-master-key

# Pepper for hashing recovery codes (AUTH-R-03, ADR 0011 B1). Deliberately NOT the vault
# key: recovery codes must keep working when the PKCS12 vault key is lost. Back this up
# with the application configuration — losing it invalidates every outstanding code
# (administrators can still re-enrol a user).
# NO DEFAULT ON PURPOSE. A per-deployment secret must not be committed: a default in this file is
# the same value on every installation, which makes the pepper worthless — it would be a public
# constant in a public repository, and one leaked hash would be attackable offline. The application
# refuses to start without it rather than falling back, because a silent fallback is a deployment
# that believes it is protected and is not.
qbic.security.recovery-code.pepper=${RECOVERY_CODE_PEPPER}

# Second-factor posture (MILESTONE-MFA, ADR 0011 P1). OFF | OPTIONAL | REQUIRED.
# Default OFF: deploying the login challenge must not change behaviour until the
# rollout decides it should. OPTIONAL challenges users who enrolled and lets
# everyone else in; REQUIRED denies an unenrolled account after its grace window.
# `grace` is an ISO-8601 duration (PT48H = 48 hours) granted per account at its
# first login under REQUIRED.
qbic.security.mfa.mode=REQUIRED
qbic.security.mfa.grace=PT48H
# Accounts created after this instant are not owed a grace window: they enrol at their first
# login instead of starting a countdown, so the unenrolled population cannot grow. Leave empty
# to keep granting every account a window (an installation that has not been switched to
# REQUIRED yet). Set it to the instant the posture was switched on.
# qbic.security.mfa.grace-cutoff=2026-11-20T00:00:00Z
################### Datasources ###############################################
# Using Spring (Boot), you can provide multiple datasources. Each datasource
# can be configured by properties in this file.
# When configuring a datasource with transaction management and JPA
# repositories, keep in mind that you need a base package for every entity
# manager. Thus, using multiple datasources with JPA and thus multiple
# entitymanagers requires you to separate your database entity classes into
# separate packages.
