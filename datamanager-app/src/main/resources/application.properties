###############################################################################
################### server location ###########################################
server.port=${DM_PORT:8080}
server.servlet.context-path=${DM_SERVICE_CONTEXT_PATH:}
###############################################################################
################### email configuration ########################################
# For certain situations the application needs to send out emails.
# The email server configured here sends the emails.
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.host=${MAIL_HOST}
spring.mail.default-encoding=UTF-8
# Honour MAIL_PORT. This was hardcoded to 587 until 1.20.5 while README.md documented MAIL_PORT as
# configurable, so a deployment on 465 or 2525 had its setting silently ignored - Spring Boot does not
# fail on an environment variable nothing reads.
spring.mail.port=${MAIL_PORT:587}

# Submission must be authenticated and encrypted. Without these the application still sends mail,
# because Jakarta Mail only *offers* credentials — a relay that does not require them accepts the
# message anyway, and the mail leaves unauthenticated and in cleartext.
#
# Both were missing until 1.20.4. The symptom is silent: mail is delivered, so nothing looks broken,
# while the recipient's headers show `with ESMTP` (no TLS) and there is no authentication on the hop.
#
# `starttls.required` (not just `starttls.enable`) is what makes this fail loudly: if the server does
# not offer STARTTLS, sending is refused instead of silently continuing unencrypted. That is the
# intended behaviour — a mail server that cannot do TLS for submission is a deployment problem to
# fix, not something to fall back from.
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Verify the SMTP connection once at startup and refuse to boot if the credentials are rejected or
# the server will not upgrade to TLS. Without this the failure is silent: a relay that does not
# require authentication accepts the mail anyway, so the application reports success while the
# message leaves unauthenticated and in cleartext.
#
# On by default in production, where a broken mail server must be a failed start rather than a
# discovery made by a user who never received a confirmation link. Local development and CI have no
# reachable mail server, so they disable it:
#   QBIC_MAIL_VERIFY_CONNECTION_ON_STARTUP=false
qbic.mail.verify-connection-on-startup=${QBIC_MAIL_VERIFY_CONNECTION_ON_STARTUP:true}
# Prefix applied to the subject of developer error notification emails (logback SMTPAppender).
# Useful to identify which instance sent the email when multiple instances run concurrently.
qbic.logging.error.subject-prefix=[Data Manager]
# Recipient(s) of developer error notification emails (logback SMTPAppender). Comma-separated list.
qbic.logging.error.recipient=<CHANGE_ME>
# Sometimes additional information about the instance is needed for an email
# these properties are configured here
service.host.name=${DM_SERVICE_HOST:127.0.0.1}
service.host.protocol=${DM_HOST_PROTOCOL:https}
# The default port is -1, which means "no port". The port part is omitted
# automatically when constructing links (see DataManagerContextProvider).
service.host.port=${DM_SERVICE_PORT:-1}
# The path to an existing directory on the host's file system where
# the application will create temporary directories, e.g. for preparing download assets
service.host.temp.dir=${DM_TEMP_DIR:./tmp}
###############################################################################
################### OpenBis configuration #####################################
openbis.user.name=${OPENBIS_USER_NAME:}
openbis.user.password=${OPENBIS_USER_PASSWORD:}
openbis.datasource.as.url=${OPENBIS_AS_URL:}
openbis.datasource.dss.url=${OPENBIS_DSS_URL:}
# Read timeout for a single openBIS call, in milliseconds. This value is part of the retry budget
# arithmetic (OpenbisRetryPolicy): each retry attempt can consume it, and the UI timeout is derived
# from it. Changing it changes how long a stalled openBIS can block a request.
openbis.datasource.read-timeout-ms=${OPENBIS_READ_TIMEOUT_MS:100000}
###############################################################################
################### Vaadin configuration ######################################
# To improve the performance during development.
# For more information https://vaadin.com/docs/flow/spring/tutorial-spring-configuration.html#special-configuration-parameters.
# See https://vaadin.com/docs/latest/flow/configuration/properties#properties for property reference
vaadin.productionMode=true
vaadin.allowed-packages=com.vaadin,org.vaadin,dev.hilla,life.qbic
# Launch the default browser when starting the application in development mode
vaadin.launch-browser=false
# Configures the lock check strategy in Vaadin and enables easier tracing for session lock issues.
# or THROW for more restriction and fail fast strategy (e.g. during development)
