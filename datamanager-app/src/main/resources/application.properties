################# Terminology Service ########################################
terminology.service.tib.endpoint.select=${TIB_SERVICE_API_SELECT_ENDPOINT:/api/select}
terminology.service.tib.api.url=${TIB_SERVICE_API_URL:https://api.terminology.tib.eu}
terminology.service.tib.endpoint.search=${TIB_SERVICE_API_SEARCH_ENDPOINT:/api/search}
# Configures the number of entries the local terminology lookup cache should store at maximum
# before overwriting entries with low usage statistics
terminology.service.cache.size=${TERM_CACHE_SIZE:10000}
###############################################################################
################### Message providers #########################################
spring.messages.encoding=UTF-8
spring.messages.cache-duration=1s
spring.messages.fallback-to-system-locale=true
spring.messages.basename=messages.error-messages, messages.toast-notifications, messages.dialog-notifications, messages.dialog-messages
# you always have to escape single quotes by another single quote ' -> ''
# https://www.mscharhag.com/java/resource-bundle-single-quote-escaping for reference
spring.messages.always-use-message-format=true
###############################################################################
################### Raw Data Sync #############################################
# Batch size for each remote sync query iteration.
# Reduce (e.g. to 200) during large backlog re-syncs to lower database lock contention.
qbic.sync.raw-data.batch-size=${SYNC_RAW_DATA_BATCH_SIZE:1000}
# Maximum wall-clock duration in milliseconds for a single scheduled sync job execution.
# Must remain smaller than the ShedLock lockAtMostFor value (currently PT40S = 40000ms).
qbic.sync.raw-data.max-duration-ms=${SYNC_RAW_DATA_MAX_DURATION_MS:10000}

# ── InvenioRDM instances (admin-configured; ADR-0002 I2) ────────────
# Adding a new instance is a config change + redeploy. Users cannot add
# arbitrary URLs via the UI. The api-version field is reserved for
# future per-instance adapter dispatch (currently unused; defaults to
# version 12 of the Invenio REST API spec).
qbic.external-service.invenio-rdm.instances[0].id=zenodo
qbic.external-service.invenio-rdm.instances[0].display-name=Zenodo
qbic.external-service.invenio-rdm.instances[0].base-url=https://zenodo.org
qbic.external-service.invenio-rdm.instances[0].api-version=12

qbic.external-service.invenio-rdm.instances[1].id=fdat
qbic.external-service.invenio-rdm.instances[1].display-name=FDAT
qbic.external-service.invenio-rdm.instances[1].base-url=https://fdat.uni-tuebingen.de
qbic.external-service.invenio-rdm.instances[1].api-version=12

qbic.external-service.invenio-rdm.instances[2].id=fdat-sandbox
qbic.external-service.invenio-rdm.instances[2].display-name=FDAT Sandbox
qbic.external-service.invenio-rdm.instances[2].base-url=https://dev.fdat.uni-tuebingen.de
qbic.external-service.invenio-rdm.instances[2].api-version=12
# Accounts created after this instant are not owed a grace window: they enrol at their first
# login instead of starting a countdown. Leave empty to keep granting every account a window
# (the behaviour of an installation that has not been switched to REQUIRED yet).
# qbic.security.mfa.grace-cutoff=2026-11-20T00:00:00Z
# Lifetime of the one-time link that lets a user without a factor start an enrolment again.
# Bounded to 15 minutes at startup (AUTH-R-05, by analogy with password reset).
qbic.verification-token.reenrol-lifetime=${MFA_REENROL_LINK_LIFETIME:PT15M}
# Reminders sent to unenrolled accounts before their grace window ends. Two mails (a day before, and
# a couple of hours before) are the cheapest way to keep a deadline from arriving as a surprise.
# Set interval-ms to -1 to switch the mails off without changing the policy.
qbic.security.mfa.reminders.soon-before=${MFA_REMINDER_SOON_BEFORE:PT24H}
qbic.security.mfa.reminders.final-before=${MFA_REMINDER_FINAL_BEFORE:PT2H}
qbic.security.mfa.reminders.interval-ms=${MFA_REMINDER_INTERVAL_MS:300000}
