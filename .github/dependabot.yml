# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates
#
# NOTE: This file only controls *version upgrades*. CVE detection and reports
# are handled by .github/workflows/dependency-vulnerability-scan.yml
# (see docs/security/vulnerability-management.md).

version: 2
updates:
  - package-ecosystem: "github-actions" # See documentation for possible values
    directory: "/" # Location of package manifests
    schedule:
      interval: "weekly"
    groups:
      # Consolidate all GitHub Actions updates into a single pull request.
      github-actions:
        patterns:
          - "*"

  # All Maven modules are covered by a single update entry so that updates can
  # be grouped across them (a group is scoped to one update entry). Dependabot
  # does not recurse into submodules, so every directory must be listed:
  #   - "/"                root aggregator pom (plugin/dependency management)
  #   - "/datamanager-bom" where all third-party versions are pinned
  #   - "/datamanager-app" deployable application module (Vaadin, Spring Boot, ...)
  - package-ecosystem: "maven"
    directories:
      - "/"
      - "/datamanager-bom"
      - "/datamanager-app"
    schedule:
      interval: "weekly"
    groups:
      # Consolidate all minor and patch Maven updates into a single pull request.
      # Major updates do not match this group and are therefore raised as
      # individual pull requests (one pull request per major version bump).
      maven-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
