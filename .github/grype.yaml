# Grype configuration for the dependency vulnerability scan
# (see .github/workflows/dependency-vulnerability-scan.yml).
#
# This file is the *accepted-risk ledger* for dependency CVEs. An entry here
# suppresses a finding from the report and the SARIF upload. Suppressions are
# only allowed when the risk has been assessed and an expiry is recorded:
#
#   * Every `reason` MUST contain a ticket reference and an expiry date in the
#     form `exp:YYYY-MM-DD`.
#   * The dependency scan workflow re-reviews expired entries (see
#     docs/security/vulnerability-management.md).
#
# Do not add an entry to silence a finding that can be fixed by upgrading a
# coordinate in datamanager-bom/pom.xml — fix it instead.
ignore:
  # Tomcat cluster TLS-PSK peer authentication (CVE-2026-133325)
  #
  # Affects tomcat-embed-core 11.0.28-11.0.29 ONLY. There is no fixed release
  # available: Apache says "Until Tomcat 11.0.30 is available, users are
  # recommended to switch to TLS 1.2" (tomcat.apache.org/security-11.html).
  # So this cannot be fixed by a version bump, which is the only circumstance in
  # which an entry belongs here.
  #
  # Not reachable in this application, on three independent grounds:
  #   1. The flaw is in Tomcat's Tribes cluster receiver. No ClusterListener is
  #      configured anywhere, and no clustering property is set.
  #   2. org.apache.catalina.tribes is not on the classpath at all. The only
  #      tomcat artifacts resolved are tomcat-embed-core, -el and -websocket.
  #   3. The precondition is a cluster channel secured with TLS 1.3 + TLS-PSK.
  #      This deployment terminates TLS at HAProxy and configures no PSK.
  #
  # Revisit when 11.0.30 ships: the pin to 11.0.29 should then move forward and
  # this entry must be deleted in the same change.
  #
  # `name` is the ARTIFACT name, not the Maven coordinate. Grype matches against
  # the artifact name it parsed from the SBOM, so "tomcat-embed-core" works and
  # "org.apache.tomcat.embed:tomcat-embed-core" silently does not.
  - vulnerability: CVE-2026-133325
    package:
      name: tomcat-embed-core
      version: "11.0.29"
    reason: "Tomcat Tribes clustering is not used and org.apache.catalina.tribes is not on the classpath; no fixed release exists yet (11.0.30 unreleased, Apache recommends TLS 1.2 in the interim); exp:2027-01-31; see PR #1771"
