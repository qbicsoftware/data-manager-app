# This workflow will build a package using Maven and then publish it to
# qbic-repo.qbic.uni-tuebingen.de packages when a release is created
# For more information see: https://github.com/actions/setup-java#apache-maven-with-a-settings-path

name: Deploy Snapshot

on:
  push:
    branches:
      - development
  pull_request:
    branches:
      - main

# Least privilege at the workflow level; write scopes are granted per job below.
permissions:
  contents: read

jobs:
  publish_snapshot:

    runs-on: ubuntu-latest
    permissions:
      id-token: write # This is required for requesting the JWT (provenance)
      contents: read # This is required for actions/checkout
      attestations: write   # required for provenance

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'zulu'
          java-version: '21'
          settings-path: ${{ github.workspace }}

      - name: Load local Maven repository cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      # Remove existing snapshot tags which are not supposed to be present
      - name: Remove snapshot tags
        run: mvn versions:set -DremoveSnapshot
      # Set the SNAPSHOT for this build and deployment
      - name: Set version in Maven project
        run: mvn versions:set -DnewVersion='${project.version}-SNAPSHOT' -DprocessAllModules

      - name: Build with Maven
        run: mvn -B package -Pproduction -Dvaadin.force.production.build=true --file pom.xml

      # Generate provenance (SLSA attestation) for all JARs
      - name: Generate SLSA build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "**/target/*.jar"

      - name: Publish artefact to QBiC Nexus Repository
        run: mvn --quiet --settings $GITHUB_WORKSPACE/.github.settings.xml -Pproduction -Dvaadin.force.production.build=true -DskipTests deploy
        env:
          MAVEN_REPO_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          MAVEN_REPO_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
