name: Run Maven Tests

on:
  pull_request:
    types:
      - opened
      - ready_for_review
  push:
    branches:
      - '**'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required by the sigstore Maven plugin during `verify`

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up JDK 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Load local Maven repository cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          # Workflow-scoped key. actions/cache only writes on a key miss, so a key
          # shared between workflows freezes whichever plugin set was fetched first
          # and later runs of other workflows must re-fetch the rest from Central
          # every time. This workflow needs `mvn clean verify`, so it gets its own
          # cache. The run id keeps the entry refreshable instead of frozen for the
          # life of a POM hash; restore-keys keeps it warm across runs.
          key: ${{ runner.os }}-maven-tests-${{ hashFiles('**/pom.xml') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-maven-tests-${{ hashFiles('**/pom.xml') }}
            ${{ runner.os }}-maven-tests-

      - name: Run tests
        run: mvn clean verify
