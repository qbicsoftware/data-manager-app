name: Scorecard supply-chain security

# OpenSSF Scorecard runs a set of supply-chain security checks (branch
# protection, dependency update tooling, pinned dependencies, dangerous
# workflows, vulnerabilities, ...) and publishes results to the repository
# Security tab plus the public Scorecard API used by the README badge.
#
# Requires a public repository.

on:
  # Re-run when branch protection rules for the repo change.
  branch_protection_rule:
  schedule:
    - cron: '21 4 * * 6'
  push:
    branches: [ 'main' ]
  # Allow a manual run once the workflow is on the default branch.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload SARIF to code scanning
      id-token: write        # publish results to the Scorecard API
      contents: read
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          # Publishes the score so api.securityscorecards.dev serves the badge.
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: results.sarif
