name: Scorecard supply-chain security

# OpenSSF Scorecard runs a set of supply-chain security checks (branch
# protection, dependency update tooling, pinned dependencies, dangerous
# workflows, vulnerabilities, ...) and publishes results to the repository
# Security tab plus the public Scorecard API used by the README badge.
#
# Requires a public repository.

on:
  # Re-run when branch protection rules for the repo change.
  branch_protection_rule:
  schedule:
    - cron: '21 4 * * 6'
  push:
    branches: [ 'main' ]

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload SARIF to code scanning
      id-token: write        # publish results to the Scorecard API
      contents: read
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Run Scorecard analysis
        uses: ossf/scorecard-action@v2.4.1
        with:
          results_file: results.sarif
          results_format: sarif
          # Publishes the score so api.securityscorecards.dev serves the badge.
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
