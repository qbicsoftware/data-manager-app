name: Label Pull Requests

permissions:
  contents: read
  pull-requests: write

on:
  pull_request:
    types: [ opened, edited ]

jobs:
  Assign-Label-To-Pull-Request:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          repo-token: "${{ secrets.GITHUB_TOKEN }}"
