name: SonarCloud Analysis

# Run this workflow on commits to the development branch
on:
  push:
    branches:
      - development
      - main
  pull_request:
    branches:
      - development
      - main

permissions:
  contents: read

jobs:
  sonarcloud:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required by the sigstore Maven plugin during `install`

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: 'zulu'
          java-version: '21'
      - name: Load local Maven repository cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # Build the project (runs tests and generates the aggregated JaCoCo coverage report at
      # datamanager-app/target/site/jacoco-aggregate/jacoco.xml during the `verify` phase).
      - name: Build with Maven
        run: mvn clean verify

      # Run SonarCloud analysis. The JaCoCo `report-aggregate` goal runs in the `verify` phase
      # above, so the report Sonar consumes (sonar.coverage.jacoco.xmlReportPaths) is already
      # present on disk here.
      - name: SonarCloud Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }} # Use the token stored in GitHub secrets
        run: mvn org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
